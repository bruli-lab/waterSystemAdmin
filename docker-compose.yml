services:
  admin:
    build:
      context: .
    container_name: admin
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
        - SERVER_URL=:3000
        - WS_AUTH_TOKEN=${WS_AUTH_TOKEN:-token}
        - API_URL=${API_URL:-water_system:8080}
        - PASSWORD_FILE=${PASSWORD_FILE:-/tmp/password}
        - LOG_LEVEL=debug
        - SESSION_KEY=${SESSION_KEY:-local-dev-session-key}
    networks:
        - water_system
    command: ["air", "-c", ".air.toml"]

networks:
    water_system:
        external: true
