{{define "title"}}Create a new password{{end}}
{{define "content"}}
<h4 class="mb-3">Create a new password</h4>
{{template "alerts" .}}
<form method="POST" action="/password" class="mb-3 text-start">
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required autofocus>
    </div>
    <div class="mb-3">
        <label for="re-password" class="form-label">Repeat password</label>
        <input type="password" class="form-control" id="re-password" name="re-password" required>
    </div>
    <div class="d-grid">
        <button type="submit" class="btn btn-primary">Create</button>
    </div>
</form>
{{end}}
