{{define "content"}}
{{$id := .Data.ZoneID}}
<div class="container">
    <h2 class="text-center my-4">{{if .Data.Fertilizer}}Fertilizer{{else}}Execution{{end}}</h2>
    {{template "alerts" .}}

    <div class="d-flex justify-content-center">
        <form action="{{if .Data.Fertilizer}}/fertilizer/{{$id}}{{else}}/execution/{{$id}}{{end}}" method="POST"
              class="p-4 border rounded shadow-sm" style="max-width: 400px; width: 100%;">
            <div class="mb-3">
                <label for="zone" class="form-label">Zone</label>
                <input type="text" class="form-control text-center" id="zone" disabled value="{{$id}}">
            </div>

            <div class="mb-3">
                <label for="seconds" class="form-label">Seconds</label>
                <input type="number" min="1" class="form-control text-center" id="seconds" name="seconds" required>
            </div>

            <button type="submit" class="btn btn-primary w-100"{{if .Cleaning}} disabled{{end}}>Execute</button>
        </form>
    </div>
</div>
{{end}}
