version: '3'

vars:
  APP: 'admin'
  DOCKER_COMPOSE: 'COMPOSE_BAKE=true docker compose'
  GOLANGCI_LINT_VERSION: 'v2.15.0'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
    silent: true

  docker-logs:
    desc: Show logs for the app container
    cmds:
      - |
        set -euo pipefail
        echo "👀 Showing logs for container {{.APP}} (CTRL+C to exit)..."
        docker logs -f {{.APP}}

  docker-up:
    desc: Start services with Docker Compose
    cmds:
      - |
        set -euo pipefail
        echo "🚀 Starting services with Docker Compose..."
        {{.DOCKER_COMPOSE}} up -d --build {{.APP}}

  docker-down:
    desc: Stop and remove Docker Compose services
    cmds:
      - |
        set -euo pipefail
        echo "🛑 Stopping and removing Docker Compose services..."
        {{.DOCKER_COMPOSE}} down

  docker-ps:
    desc: Show active Docker Compose services
    cmds:
      - |
        set -euo pipefail
        echo "📋 Active services:"
        {{.DOCKER_COMPOSE}} ps

  docker-exec:
    desc: Open a shell inside the app container
    cmds:
      - |
        set -euo pipefail
        echo "🔎 Opening shell inside container..."
        docker exec -it {{.APP}} bash

  security:
    desc: Check Go vulnerabilities
    cmds:
      - |
        set -euo pipefail
        echo "👉 Check security"
        go tool govulncheck ./...

  install-lint:
    desc: Install golangci-lint
    cmds:
      - |
        set -euo pipefail
        echo "🔧 Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}

  lint:
    desc: Run golangci-lint
    deps:
      - install-lint
    cmds:
      - |
        set -euo pipefail
        echo "🚀 Executing golangci-lint..."
        golangci-lint run ./...

  fumpt:
    desc: Format code with gofumpt
    cmds:
      - |
        set -euo pipefail
        echo "👉 Formating code with gofumpt..."
        go tool gofumpt -w -l .

  check:
    desc: Format and lint code
    deps:
      - fumpt
      - lint

  edit-vault:
    desc: Edit Ansible vault file
    cmds:
      - |
        set -euo pipefail
        echo "🏗️  Editing vault file"
        ansible-vault edit devops/ansible/inventories/production/group_vars/raspberry_water_system_admin/vault.yml

  build:
    desc: Build ARM64 binary for Raspberry Pi
    cmds:
      - |
        set -euo pipefail
        echo "🏗️ Building ARM64 binary for Raspberry Pi..."
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -a -ldflags "-s -w" -buildvcs=false -o devops/ansible/assets/server ./cmd/server/

  deploy:
    desc: Build and deploy with Ansible
    deps:
      - build
    cmds:
      - |
        set -euo pipefail
        echo "🚚 Deploying with Ansible (production inventory)..."
        ansible-playbook -i devops/ansible/inventories/production/hosts devops/ansible/deploy.yml --ask-vault-pass
