apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: watersystem-admin
  labels:
    app: watersystem-admin
  name: watersystem-admin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: watersystem-admin

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: watersystem-admin

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: watersystem-admin
          image: ghcr.io/bruli-lab/watersystemadmin:v2.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: app-data
              mountPath: /data

          env:
            - name: SERVER_URL
              value: :8080

            - name: API_URL
              value: 192.168.1.12:8080

            - name: WS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: watersystem-secret
                  key: token

            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: watersystem-secret
                  key: session_key

            - name: PASSWORD_FILE
              value: /data/password

            - name: LOG_LEVEL
              value: info

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: watersystem-admin-data
