apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externalsecret-watersystem
  namespace: watersystem-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: watersystem-secret
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: waterSystem
        property: auth_token
    - secretKey: session_key
      remoteRef:
        key: waterSystemAdmin
        property: session_key
